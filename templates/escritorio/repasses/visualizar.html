{% extends 'base.html' %}

{% block title %}Repasse - SAFA{% endblock %}

{% block content %}
<h2><i class="fa-solid fa-money-bill-transfer me-2"></i>Repasse</h2>

<table class="table table-bordered bg-white tabela-ver">
        <tr>
            <th>Cliente</th>
            <td>{{ repasse.cliente }}</td>
        </tr>
        <tr>
            <th>Recebimento</th>
            <td>{{ repasse.recebimento }}</td>
        </tr>
        <tr>
            <th>Valor</th>
            <td>{{ repasse.valor }}</td>
        </tr>
        <tr>
            <th>Data limite</th>
            <td>{{ repasse.dataLimite }}</td>
        </tr>
        <tr>
            <th>Situação</th>
            <td>{{ repasse.situacao }}</td>
        </tr>
</table>

<div class="mt-4">
    <a href="{% url 'repasse_atualizar' repasse.pk %}" class="btn btn-warning">Atualizar</a>
    <a href="{% url 'repasse_listar' %}" class="btn btn-secondary">Voltar</a>
</div>
{% endblock %}
