{% extends 'base.html' %}

{% block title %}Advogados - SAFA{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-user-tie me-2"></i>Advogados</h2>
    <a href="{% url 'advogado_criar' %}" class="btn btn-primary">
        <i class="fa-solid fa-plus me-1"></i> Novo Advogado
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>OAB</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for advogado in advogados %}
                    <tr>
                        <td>{{ advogado.nome }}</td>
                        <td>{{ advogado.oab }}</td>
                        <td class="text-center text-nowrap">
                            <a href="{% url 'advogado_visualizar' advogado.pk %}" class="btn btn-sm btn-outline-primary me-1" title="Ver">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <a href="{% url 'advogado_atualizar' advogado.pk %}" class="btn btn-sm btn-outline-warning me-1" title="Atualizar">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a href="{% url 'advogado_deletar' advogado.pk %}" class="btn btn-sm btn-outline-danger" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">Nenhum advogado cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
